# Installed as /etc/nftables.conf by provision.sh, after @CF@ is replaced with the ranges. Only this table is ours.
@CF@
table inet tinue
delete table inet tinue
table inet tinue {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		tcp dport 22 accept
		ip saddr $CF4 tcp dport { 80, 443 } accept
		ip6 saddr $CF6 tcp dport { 80, 443 } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
