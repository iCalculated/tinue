<!doctype html>
<html lang="en" class="booting">
<head>
<meta charset="utf-8">
<script>
// Inlined first in index.html's head when the page is built for its own domain (scripts/build-static.sh, DOMAIN set).
// The other half is handoff.html, on the old address. Rounds (every hop a location.replace):
//   old page  -> here #hs=1&o=<its player>[&u=1]&to=<route>   u: it has results the server never got
//     (if that player has been brought (tinue.brought, kept here: only this side knows it arrived) and nothing is unsent: done)
//   here      -> old page #hn=<public key>[&m=1][&t=1]&to=<route>   m: only what was never sent; t: a hash of the browser id here; a one-use key pair made in this tab, its private half kept here
//   old page  -> here #hd=<the payload encrypted for that key>&to=<route>
// Encrypted because a browser keeps every address in its history (and may sync it), replaced or not, and the payload
// holds the player's token. The key is also the nonce: only the old page was told it, it is used once, within two
// minutes, so a link made by someone else can neither sign a visitor in nor replace a player. The payload is off the
// address before anything else runs. app.js waits for window.TINUE_WAIT (true: the page is being left or reloaded).
(function () {
  var OLD = 'https://shydrie.xyz/tinue/', LS, SS;
  try { LS = localStorage; SS = sessionStorage; } catch (e) { return; }
  var ROUTE = /^#\/(?:puzzle\/[A-Za-z0-9_.-]{1,64}(?:\/[0-7])?|me|leaderboard|rush|settings)?$/;
  var get = function (k) { try { return JSON.parse(LS.getItem('tinue.' + k)); } catch (e) { return null; } };
  var set = function (k, v) { try { LS.setItem('tinue.' + k, JSON.stringify(v)); } catch (e) {} };
  var del = function (k) { try { LS.removeItem('tinue.' + k); } catch (e) {} };
  var isToken = function (t) { return typeof t === 'string' && /^[a-f0-9]{48}$/.test(t); }, isGid = function (g) { return typeof g === 'string' && /^[a-f0-9]{32}$/.test(g); };
  var isObj = function (o) { return !!o && typeof o === 'object' && !Array.isArray(o); };
  var ownerOf = function (t) { var h = 0x811c9dc5, i; if (!t) return ''; for (i = 0; i < t.length; i++) h = Math.imul(h ^ t.charCodeAt(i), 0x01000193); return (h >>> 0).toString(36); }; // (outbox.js)
  var EC = { name: 'ECDH', namedCurve: 'P-256' }, AES = { name: 'AES-GCM', iv: new Uint8Array(12) }; // (a fresh key per message: the iv needn't vary)
  var b64 = function (buf) { var s = '', u = new Uint8Array(buf), i; for (i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  var un64 = function (t) { var s = atob(t.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(s.length), i; for (i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  // To the old page for this browser's player there. only: just what was never sent. → whether it leaves.
  async function go(to, only) {
    if (window.top !== window.self) return false;
    try {
      var pair = await crypto.subtle.generateKey(EC, true, ['deriveKey']);
      var s = JSON.stringify({ k: await crypto.subtle.exportKey('jwk', pair.privateKey), t: Date.now() }), pub = b64(await crypto.subtle.exportKey('raw', pair.publicKey));
      SS.setItem('tinue.hs', s);
      if (SS.getItem('tinue.hs') !== s) return false;
      location.replace(OLD + '#hn=' + pub + (only ? '&m=1' : '') + (get('gid') ? '&t=' + ownerOf(get('gid')) : '') + '&to=' + encodeURIComponent(to));
      return true;
    } catch (e) { return false; }
  }
  window.tinueBring = function () { return go('#/'); };
  async function open(s, d) {
    var u = un64(d), priv = await crypto.subtle.importKey('jwk', s.k, EC, false, ['deriveKey']), eph = await crypto.subtle.importKey('raw', u.slice(0, 65), EC, false, []);
    var key = await crypto.subtle.deriveKey({ name: 'ECDH', public: eph }, priv, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt(AES, key, u.slice(65))), function (k, v) { return k === '__proto__' ? undefined : v; });
  }
  // A player's settings and identity into this browser. What was played here without a token becomes theirs.
  var OBJ = ['prefs', 'setUnsent', 'rush', 'rushBest', 'me'], ARR = ['ninjaTransform', 'rushHistory'];
  function install(p) {
    ['myRating', 'myProv', 'next', 'queue', 'me'].forEach(del);
    if (isToken(p.token)) { set('token', p.token); del('guest'); del('seen'); } else { if (isObj(p.guest)) set('guest', p.guest); if (Array.isArray(p.seen)) set('seen', p.seen); }
    if (isGid(p.gid)) set('gid', p.gid); else del('gid'); // (a token and its gid are one)
    OBJ.forEach(function (k) { if (isObj(p[k])) set(k, p[k]); });
    ARR.forEach(function (k) { if (Array.isArray(p[k])) set(k, p[k]); });
    if (!isToken(p.token)) return;
    var o = ownerOf(p.token), keys = [], i, q = get('rushQueue');
    for (i = 0; i < LS.length; i++) if (/^tinue\.r\.\./.test(LS.key(i))) keys.push(LS.key(i));
    keys.forEach(function (k) { try { var e = JSON.parse(LS.getItem(k)); e.owner = o; addResult(e); LS.removeItem(k); } catch (x) {} });
    if (Array.isArray(q)) set('rushQueue', q.map(function (x) { if (isObj(x) && x.who === null) x.who = o; return x; }));
  }
  window.tinueInstall = install;
  function addResult(e) { // (results.js checks an entry again when it reads it)
    if (!isObj(e) || !isObj(e.body) || typeof e.puzzleId !== 'string' || !/^[\w.-]{1,64}$/.test(e.puzzleId) || typeof e.owner !== 'string' || !/^[a-z0-9]{0,12}$/.test(e.owner)) return;
    var k = 'tinue.r.' + e.owner + '.' + e.puzzleId;
    try { if (LS.getItem(k) == null) LS.setItem(k, JSON.stringify(e)); } catch (x) {}
  }
  // This browser's guest, from before it had a token: what it played is the player's who is here now.
  function adopt(x, cur) {
    var g = isObj(x) && (x.gid || (isObj(x.body) && isObj(x.body.guest) && x.body.guest.gid)), o = ownerOf(cur);
    if (cur && g && g === get('gid')) { if (x.owner === '') x.owner = o; if (x.who === null) x.who = o; }
    return x;
  }
  window.tinueBrought = function (t) { set('brought', { o: ownerOf(t), t: Date.now() }); };
  // → whether the identity here changed (the page is loaded again with it).
  function take(p) {
    if (!isObj(p) || p.v !== 1) return false;
    var cur = get('token'), y = isToken(p.token) ? p.token : null, q, seen = {};
    // what was never sent, whoever is signed in here: it goes out only as the player who played it
    if (Array.isArray(p.results)) p.results.slice(0, 50).forEach(function (e) { addResult(adopt(e, cur)); });
    if (Array.isArray(p.rushQueue)) {
      q = get('rushQueue'); q = (Array.isArray(q) ? q : []).filter(isObj);
      q.forEach(function (x) { if (isObj(x.body)) seen['r' + x.body.run] = 1; });
      p.rushQueue.slice(0, 20).forEach(function (x) { if (isObj(x) && isObj(x.body) && typeof x.body.run === 'string' && !seen['r' + x.body.run]) { seen['r' + x.body.run] = 1; q.push(adopt(x, cur)); } });
      if (q.length) set('rushQueue', q);
    }
    if (p.moved) return false; // brought before
    if (y && (get('out') || []).indexOf(ownerOf(y)) >= 0) { window.tinueBrought(y); return false; } // signed out here: stays signed out
    if (y && y === cur) { window.tinueBrought(y); return false; }
    if (y && cur) { try { SS.setItem('tinue.hp', JSON.stringify(p)); } catch (e) {} return false; } // two players: app.js asks
    if (!y && (cur || get('gid'))) { if (p.known) window.tinueBrought(null); return false; }
    install(p);
    if (y ? get('token') === y : p.known) window.tinueBrought(y); // (known: the server said there is nobody; unanswered, it is asked again)
    return true;
  }
  var h = location.hash;
  if (!/^#h[sdn]=/.test(h)) return;
  var part = function (k) { var m = new RegExp('[#&]' + k + '=([^&]*)').exec(h); return m ? m[1] : ''; }, to = '#/';
  try { to = decodeURIComponent(part('to')); } catch (e) {}
  if (!ROUTE.test(to)) to = '#/';
  history.replaceState(null, '', location.pathname + to);
  if (part('hs') === '1') {
    var was = get('brought'), o = part('o'), had = isObj(was) && (!o || o === was.o);
    if (!had || part('u') === '1') window.TINUE_WAIT = go(to, had);
    return;
  }
  var s = null, d = part('hd');
  try { s = JSON.parse(SS.getItem('tinue.hs')); SS.removeItem('tinue.hs'); } catch (e) {}
  if (!d || !s || !(Date.now() - s.t >= 0 && Date.now() - s.t < 120e3)) return;
  window.TINUE_WAIT = open(s, d).then(take).then(function (again) { if (again) location.reload(); return again; }, function () { return false; });
})();
</script>

<body>

<main id="view-puzzle" class="puzzle-page">
  <h1 class="sr-only">Puzzle</h1>
  <div id="build-bar" class="build-bar" hidden></div><div id="build-live" class="sr-only" role="status"></div>
  <section class="board-col">
    <div class="board-wrap" id="board-wrap"><div id="board" class="board-host"></div></div>
    <script>
      // The board, PTN Ninja's: start it right away, while tinue's own modules are still loading (ninja.js takes this
      // iframe over and shows it once the puzzle is drawn, or says so in its place if it doesn't come).
      {
        const b = document.getElementById('board'), f = document.createElement('iframe');
        // placeholder until it's shown, in the shape ninja.js gives a 6×6 board (ninja-look.js frameBox; ninja.js redoes
        // it for the player's look and the puzzle's size before anything shows)
        b.style.cssText = 'border-radius:var(--corner,6px);background:#262421;aspect-ratio:0.79045;overflow:hidden';
        f.style.cssText = 'display:block;border:0;background:#262421;width:111.11111%;margin:-7.73119% 0 0 -5.55556%;aspect-ratio:0.78262;opacity:0';
        // PTN Ninja says it's up once (GAME_STATE), possibly before ninja.js has loaded to hear it: noted on this frame
        addEventListener('message', function up(e) { if (e.source === f.contentWindow && e.data && e.data.action === 'GAME_STATE') { f.dataset.up = '1'; removeEventListener('message', up); } });
        var src = '&moveNumber=false&unplayedPieces=true&disableStoneCycling=true&showBoardPrefsBtn=false&disableNavigation=true&disablePTN=true&disableText=true&flatCounts=true&turnIndicator=true&gameTimer=false&showHeader=false&showEval=false&showRoads=false&stackCounts=false&notifyGame=false&disableUndo=true&showPTN=false&showText=false&showControls=false&showScrubber=false&animateBoard=true&showBoardTransformBtn=false'; // same settings as UI in ninja.js
        // The player's PTN Ninja look (Settings page) over them, as ninja-look.js frameParams lays it: only its keys, each
        // value of its form (b: true/false, p: 1 to 10, t: a compressed theme), so nothing else reaches the address.
        try {
          var look = (JSON.parse(localStorage.getItem('tinue.prefs')) || {}).ninja, K = { axisLabels: 'b', axisLabelsSmall: 'b', board3D: 'b', orthographic: 'b', perspective: 'p', centerStackCounts: 'b', stackCounts: 'b', flatCounts: 'b', flatWinHighlights: 'b', moveNumber: 'b', turnIndicator: 'b', verticalLayout: 'b', verticalLayoutAuto: 'b', theme: 't' };
          var FORM = { b: /^(true|false)$/, p: /^([1-9]|10)$/, t: /^[A-Za-z0-9$+-]{1,1500}$/ };
          if (typeof look === 'string' && look.length <= 1500) look.split('&').forEach(function (item) {
            var eq = item.indexOf('='), k = item.slice(0, eq), v = item.slice(eq + 1);
            if (eq < 1 || !Object.prototype.hasOwnProperty.call(K, k) || !FORM[K[k]].test(v)) return;
            src = src.replace(new RegExp('&' + k + '=[^&]*'), '') + '&' + k + '=' + v;
          });
        } catch (e) {}
        if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) src = src.replace('&animateBoard=true', '&animateBoard=false'); // (as ninja.js: no moving pieces)
        f.src = 'https://ptn.ninja/' + src;
        f.dataset.t0 = performance.now(); // (ninja.js counts its wait for PTN Ninja from here)
        f.addEventListener('load', function () { f.dataset.loaded = performance.now(); }, { once: true }); // (and from its page loading)
        b.append(f);
      }
    </script>
    <div id="confirm-bar" class="confirm-bar idle" hidden><span class="msg" id="confirm-msg"></span><button type="button" id="confirm-no">Cancel</button><button type="button" class="primary" id="confirm-yes">Confirm</button></div>
    <form id="ptn-form" class="ptn-form"><input id="ptn-in" class="ptn-in" aria-label="Type a move" aria-describedby="ptn-err" placeholder="Type a move, e.g. c3 or 2a1>11" autocomplete="off" autocapitalize="off" spellcheck="false" disabled><p id="ptn-err" class="ptn-err" role="alert"></p></form>
  </section>

  <aside class="side">
    <div class="panel feedback" id="feedback" aria-live="polite"></div>
    <div class="panel session" id="session"></div>
    <div class="panel moves" id="moves"></div>
    <div class="panel puzzle-info hidden" id="info"></div>
    <div class="panel controls">
      <label class="field"><span>Theme</span>
        <select id="theme"><option value="">Mix (everything)</option></select>
      </label>
      <p class="theme-desc" id="theme-desc"></p>
      <div class="row">
        <label class="field"><span>Difficulty</span>
          <select id="difficulty">
            <option value="easiest">Easiest (−600)</option><option value="easier">Easier (−300)</option>
            <option value="normal" selected>Normal</option>
            <option value="harder">Harder (+300)</option><option value="hardest">Hardest (+600)</option>
          </select>
        </label>
        <label class="field"><span>Board size</span>
          <select id="size"><option value="6">6×6</option></select>
        </label>
      </div>
      <p class="set-link"><a href="#/settings">Settings</a></p>
    </div>
  </aside>
</main>
