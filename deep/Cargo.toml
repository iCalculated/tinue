[package]
name = "deep"
version = "0.1.0"
edition = "2021"
description = "Native tinue (Tak forced-win) solver for 6x6: bitboard rules, df-pn over threats, proof checker"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "deep"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.test]
opt-level = 3
